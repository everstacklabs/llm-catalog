name: "minimax/minimax-m3"
display_name: "MiniMax-M3 (OpenRouter)"
family: "minimax"
status: "stable"
release_date: "2026-06-01"

cost:
  input_per_1k: 0.0003
  output_per_1k: 0.0012
  cache_read_per_1k: 0.00006

limits:
  max_tokens: 1048576
  max_completion_tokens: 512000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video"]
  output: ["text"]
notes: "MiniMax multimodal model for long-context coding, perception, and agent planning"
