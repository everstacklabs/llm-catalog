name: "anthropic/claude-opus-4.8-fast"
display_name: "Claude Opus 4.8 (Fast) (OpenRouter)"
family: "claude-opus"
status: "stable"
release_date: "2026-05-28"

cost:
  input_per_1k: 0.01
  output_per_1k: 0.05
  cache_read_per_1k: 0.001
  cache_write_per_1k: 0.0125

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-01"
notes: "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
